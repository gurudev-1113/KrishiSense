<!-- KrishiSense Profile Photo Modal Component -->
<div class="krishi-modal-backdrop" id="krishiProfileModal" style="display:none;">
  <div class="krishi-profile-card" onclick="event.stopPropagation();">
    <div class="krishi-profile-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-user-pen" style="color:#f59e0b; font-size:1.1rem;"></i>
        <span style="font-weight:800; font-size:1.05rem; color:#ffffff;">Update Profile Photo</span>
      </div>
      <button type="button" class="krishi-profile-close" onclick="closeKrishiProfileModal()" title="Close">&times;</button>
    </div>

    <div class="krishi-profile-body">
      <!-- Avatar Preview -->
      <div class="krishi-profile-preview-box">
        <div class="krishi-profile-circle-wrap" onclick="document.getElementById('pmFileInput').click()" title="Click to upload custom photo">
          <img src="{{ profile_image or '/static/img/default-avatar.png' }}" alt="Profile Preview" class="krishi-profile-large-img" id="pmLargePreview" onerror="this.onerror=null; this.src='/static/img/default-avatar.png';">
          <span class="krishi-profile-camera-badge"><i class="fa-solid fa-camera"></i></span>
        </div>
        <div class="krishi-profile-username" id="pmUsernameDisplay">{{ username or 'User' }}</div>
        <span class="krishi-profile-role-badge"><i class="fa-solid fa-seedling"></i> KrishiSense Member</span>
      </div>

      <!-- Upload from Device -->
      <div style="font-size:0.82rem; font-weight:700; color:#1e293b; margin-bottom:8px;">
        <i class="fa-solid fa-cloud-arrow-up" style="color:#10b981; margin-right:4px;"></i> Upload from your device:
      </div>
      <div class="krishi-profile-upload-bar">
        <button type="button" class="krishi-btn-upload" onclick="document.getElementById('pmFileInput').click()">
          <i class="fa-solid fa-image" style="color:#059669; font-size:1.1rem;"></i>
          <span id="pmBrowseLabel" style="font-weight:600;">Choose Photo (PNG, JPG, WebP)</span>
        </button>
        <input type="file" id="pmFileInput" accept="image/png, image/jpeg, image/jpg, image/webp" style="display:none;" onchange="handleProfileFileSelected(this)">
      </div>

      <!-- Divider -->
      <div style="display:flex; align-items:center; margin:16px 0 12px; gap:10px;">
        <div style="flex:1; height:1px; background:#e2e8f0;"></div>
        <span style="font-size:0.75rem; font-weight:700; color:#94a3b8; text-transform:uppercase;">or choose preset</span>
        <div style="flex:1; height:1px; background:#e2e8f0;"></div>
      </div>

      <!-- Preset Avatars -->
      <div class="krishi-preset-grid">
        <div class="krishi-preset-item" onclick="selectPresetAvatar(this, '/static/img/default-avatar.png')" title="Classic Default">
          <img src="/static/img/default-avatar.png" class="krishi-preset-avatar" alt="Default">
          <span>Classic</span>
        </div>
        <div class="krishi-preset-item" onclick="selectPresetAvatar(this, '/static/img/avatars/farmer1.png')" title="Farmer Green">
          <img src="/static/img/avatars/farmer1.png" class="krishi-preset-avatar" alt="Farmer Green">
          <span>Farmer</span>
        </div>
        <div class="krishi-preset-item" onclick="selectPresetAvatar(this, '/static/img/avatars/agronomist.png')" title="Agronomist Blue">
          <img src="/static/img/avatars/agronomist.png" class="krishi-preset-avatar" alt="Agronomist">
          <span>Expert</span>
        </div>
        <div class="krishi-preset-item" onclick="selectPresetAvatar(this, '/static/img/avatars/farmer2.png')" title="Farmer Gold">
          <img src="/static/img/avatars/farmer2.png" class="krishi-preset-avatar" alt="Farmer Gold">
          <span>Grower</span>
        </div>
        <div class="krishi-preset-item" onclick="selectPresetAvatar(this, '/static/img/avatars/tech.png')" title="Tech Specialist">
          <img src="/static/img/avatars/tech.png" class="krishi-preset-avatar" alt="Tech">
          <span>Tech</span>
        </div>
      </div>

      <!-- Status Message Feedback -->
      <div id="pmStatusMsg" style="display:none; margin:12px 0 6px; font-size:0.84rem; text-align:center; font-weight:600; padding:8px 12px; border-radius:8px;"></div>

      <!-- Actions -->
      <div class="krishi-profile-actions">
        <button type="button" class="krishi-btn-cancel-avatar" onclick="closeKrishiProfileModal()">Cancel</button>
        <button type="button" class="krishi-btn-save-avatar" id="pmSaveBtn" onclick="saveProfilePhoto()">
          <i class="fa-solid fa-check"></i> <span id="pmSaveLabel">Save Photo</span>
        </button>
      </div>
    </div>
  </div>
</div>

<style>

  opacity: 0.7 !important;
  cursor: not-allowed !important;
}
</style>

<script>
// Standalone Profile Modal Controller
(function() {
  let chosenPreset = null;
  let chosenFile = null;

  window.openKrishiProfileModal = function() {
    const modal = document.getElementById('krishiProfileModal');
    if (!modal) return;
    
    // Set current preview
    const topAvatar = document.querySelector('.topbar-user-avatar');
    const previewImg = document.getElementById('pmLargePreview');
    if (topAvatar && previewImg && topAvatar.src) {
      previewImg.src = topAvatar.src;
    }

    // Reset status and selections
    chosenPreset = null;
    chosenFile = null;
    const fileInput = document.getElementById('pmFileInput');
    if (fileInput) fileInput.value = '';
    const browseLabel = document.getElementById('pmBrowseLabel');
    if (browseLabel) browseLabel.textContent = 'Choose Photo (PNG, JPG, WebP)';
    
    document.querySelectorAll('.krishi-preset-item').forEach(el => el.classList.remove('selected'));
    
    const statusMsg = document.getElementById('pmStatusMsg');
    if (statusMsg) {
      statusMsg.style.display = 'none';
      statusMsg.textContent = '';
    }

    const saveBtn = document.getElementById('pmSaveBtn');
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> <span>Save Photo</span>';
    }

    modal.style.display = 'flex';
    // Trigger transition
    setTimeout(() => modal.classList.add('open'), 10);
  };

  window.closeKrishiProfileModal = function() {
    const modal = document.getElementById('krishiProfileModal');
    if (!modal) return;
    modal.classList.remove('open');
    setTimeout(() => { modal.style.display = 'none'; }, 220);
  };

  window.selectPresetAvatar = function(itemEl, url) {
    document.querySelectorAll('.krishi-preset-item').forEach(el => el.classList.remove('selected'));
    itemEl.classList.add('selected');
    chosenPreset = url;
    chosenFile = null;
    const fileInput = document.getElementById('pmFileInput');
    if (fileInput) fileInput.value = '';
    const browseLabel = document.getElementById('pmBrowseLabel');
    if (browseLabel) browseLabel.textContent = 'Choose Photo (PNG, JPG, WebP)';
    
    const previewImg = document.getElementById('pmLargePreview');
    if (previewImg) previewImg.src = url;

    const statusMsg = document.getElementById('pmStatusMsg');
    if (statusMsg) statusMsg.style.display = 'none';
  };

  window.handleProfileFileSelected = function(input) {
    const file = input.files && input.files[0];
    if (file) {
      chosenFile = file;
      chosenPreset = null;
      document.querySelectorAll('.krishi-preset-item').forEach(el => el.classList.remove('selected'));
      
      const browseLabel = document.getElementById('pmBrowseLabel');
      if (browseLabel) {
        browseLabel.textContent = file.name.length > 22 ? file.name.substring(0, 19) + '...' : file.name;
      }

      const previewImg = document.getElementById('pmLargePreview');
      if (previewImg) {
        previewImg.src = URL.createObjectURL(file);
      }

      const statusMsg = document.getElementById('pmStatusMsg');
      if (statusMsg) statusMsg.style.display = 'none';
    }
  };

  window.saveProfilePhoto = function() {
    const statusMsg = document.getElementById('pmStatusMsg');
    const saveBtn = document.getElementById('pmSaveBtn');

    if (!chosenFile && !chosenPreset) {
      if (statusMsg) {
        statusMsg.style.display = 'block';
        statusMsg.style.background = '#fef3c7';
        statusMsg.style.color = '#b45309';
        statusMsg.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> Please select a preset avatar or browse a new photo.';
      }
      return;
    }

    if (saveBtn) {
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
    }

    const formData = new FormData();
    if (chosenFile) {
      formData.append('profile_image', chosenFile);
    } else if (chosenPreset) {
      formData.append('preset', chosenPreset);
    }

    fetch('/api/user/profile-image', {
      method: 'POST',
      body: formData
    })
    .then(r => r.json())
    .then(data => {
      if (data.success && data.profile_image) {
        window.__KRISHI_USER_AVATAR__ = data.profile_image;
        document.querySelectorAll('.topbar-user-avatar').forEach(img => {
          img.src = data.profile_image;
        });

        if (statusMsg) {
          statusMsg.style.display = 'block';
          statusMsg.style.background = '#dcfce7';
          statusMsg.style.color = '#15803d';
          statusMsg.innerHTML = '✅ Profile photo updated successfully!';
        }

        if (saveBtn) {
          saveBtn.innerHTML = '<i class="fa-solid fa-check-double"></i> Saved!';
        }

        setTimeout(() => {
          window.closeKrishiProfileModal();
        }, 850);
      } else {
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Save Photo';
        }
        if (statusMsg) {
          statusMsg.style.display = 'block';
          statusMsg.style.background = '#fee2e2';
          statusMsg.style.color = '#b91c1c';
          statusMsg.textContent = data.error || 'Failed to update profile photo.';
        }
      }
    })
    .catch(err => {
      if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-check"></i> Save Photo';
      }
      if (statusMsg) {
        statusMsg.style.display = 'block';
        statusMsg.style.background = '#fee2e2';
        statusMsg.style.color = '#b91c1c';
        statusMsg.textContent = 'Network error while updating photo. Please try again.';
      }
    });
  };

  // Click outside to close
  document.addEventListener('click', function(e) {
    const modal = document.getElementById('krishiProfileModal');
    if (modal && e.target === modal) {
      window.closeKrishiProfileModal();
    }
  });

  // ESC to close
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeKrishiProfileModal();
    }
  });

  // Wire up all click triggers globally
  document.addEventListener('click', function(e) {
    const trigger = e.target.closest('.user-profile-badge, #openProfileModalBtn, .badge-change-photo-btn, [data-open-profile-modal]');
    if (trigger) {
      e.preventDefault();
      e.stopPropagation();
      window.openKrishiProfileModal();
    }
  });
})();
</script>
